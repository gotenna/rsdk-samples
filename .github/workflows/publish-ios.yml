name: Publish iOS Sample

# Builds and publishes the iOS sample app (unsigned, device arm64) to
# Artifactory whenever the iOS sample changes on main. The build number is the
# workflow run number, so it increases monotonically without version-bump
# commits. The SDK token placeholders in ViewController.swift are substituted
# from secrets for the CI build only.

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'gotenna/rsdk-samples'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject SDK credentials
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
          SDK_APP_ID: ${{ secrets.SDK_APP_ID }}
        run: |
          sed -i '' \
            -e "s|<#YOUR_SDK_TOKEN#>|${SDK_TOKEN}|" \
            -e "s|<#YOUR_APP_ID#>|${SDK_APP_ID}|" \
            ios-sample-app/ViewController.swift

      - name: Build app (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios-sample-app.xcodeproj \
            -scheme ios-sample-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Upload app to JFrog Artifactory
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);$/\1/p' ios-sample-app.xcodeproj/project.pbxproj | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Error: could not read MARKETING_VERSION from project.pbxproj"
            exit 1
          fi
          APP_ZIP="rsdk-sample-ios.app.zip"
          (cd build/Build/Products/Release-iphoneos && zip -r -y "../../../${APP_ZIP}" ios-sample-app.app)
          ARTIFACT_URL="https://gotenna.jfrog.io/artifactory/rsdk-samples/mobile-apps/ios/regular/${VERSION}-${{ github.run_number }}/${APP_ZIP}"
          curl -sSf -u "${ARTIFACTORY_USER}:${ARTIFACTORY_PASSWORD}" \
            -T "build/${APP_ZIP}" \
            "$ARTIFACT_URL"
          echo "Published ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
